# Panel de administración de la web (Pages CMS · https://app.pagescms.org)
# Cada vez que alguien guarda, la web se publica sola en 1-2 minutos.

media:
  input: assets/uploads
  output: /assets/uploads
  extensions: [jpg, jpeg, png, webp, gif]

content:
  # ───────────── PUBLICACIONES ─────────────
  - name: publicaciones
    label: Publicaciones
    type: group
    items:
      - name: noticias
        label: Noticias y columnas
        type: collection
        path: content/noticias
        filename: "{year}-{month}-{day}-{primary}.md"
        view:
          fields: [titulo, categoria, autor, fecha, destacada]
          primary: titulo
          sort: [fecha, titulo]
          default:
            sort: fecha
            order: desc
          search: [titulo, bajada, autor]
        fields:
          - name: titulo
            label: Título
            type: string
            required: true
          - name: bajada
            label: Bajada
            description: Resumen de 1 o 2 líneas que aparece bajo el título y en las tarjetas.
            type: text
          - name: categoria
            label: Sección
            description: Dónde aparece. Elige "Opinión" para columnas firmadas (se muestran con la foto y el nombre de quien escribe).
            type: select
            required: true
            default: actualidad
            options:
              values:
                - { name: actualidad, label: Actualidad }
                - { name: comunidad, label: Comunidad }
                - { name: deportes, label: Deportes }
                - { name: cultura, label: Cultura }
                - { name: pueblo-mapuche, label: Pueblo Mapuche }
                - { name: opinion, label: Opinión (columna) }
          - name: fecha
            label: Fecha y hora de publicación
            type: date
            required: true
            options:
              time: true
              format: "yyyy-MM-dd'T'HH:mm"
          - name: imagen
            label: Foto principal
            description: Ideal vertical 4:5 (1080×1350), igual que en Instagram. También sirven 9:16 o fotos horizontales.
            type: image
          - name: pie_imagen
            label: Pie de foto
            type: string
          - name: video
            label: Video de YouTube (opcional)
            description: Pega el link. Si lo pones, el video reemplaza a la foto arriba de la nota.
            type: string
          - name: autor
            label: Autor/a
            type: string
            default: "Abajo’e la Línea"
          - name: autor_cargo
            label: Cargo o descripción del autor/a (columnas)
            description: Ej. "Dirigenta vecinal de Pedro de Valdivia". Se muestra en las columnas de opinión.
            type: string
          - name: autor_foto
            label: Foto del autor/a (columnas)
            description: Foto cuadrada de la cara. Se muestra redonda en las columnas de opinión.
            type: image
          - name: destacada
            label: Destacar en portada
            description: Será la nota principal de la portada durante una semana (no aplica a columnas).
            type: boolean
            default: false
          - name: borrador
            label: Borrador
            description: Marcado = no se publica todavía.
            type: boolean
            default: false
          - name: fuente
            label: Fuente / link original (opcional)
            type: string
          - name: body
            label: Texto
            type: rich-text

      - name: publicidad
        label: Publicidad
        type: file
        path: content/publicidad.json
        format: json
        list: true
        fields:
          - name: nombre
            label: Nombre del auspiciador
            type: string
            required: true
          - name: activo
            label: Activo
            description: Desmárcalo para pausar el aviso sin borrarlo.
            type: boolean
            default: true
          - name: ubicacion
            label: Dónde se muestra
            description: Puedes elegir varios lugares. Si hay varios avisos en el mismo lugar, se muestra uno al azar en cada visita.
            type: select
            options:
              multiple: true
              values:
                - { name: portada-superior, label: "Portada · arriba (bajo la señal en vivo) — banner ancho 1200×200" }
                - { name: portada-media, label: "Portada · al medio (después de las noticias) — banner ancho 1200×200" }
                - { name: secciones, label: "Páginas de secciones · arriba — banner ancho 1200×200" }
                - { name: nota-lateral, label: "Notas · columna derecha — cuadrado 600×600 o vertical 600×900" }
                - { name: nota-inferior, label: "Notas · al final del texto — banner 1200×300" }
          - name: imagen
            label: Imagen del aviso
            type: image
            required: true
          - name: imagen_movil
            label: Imagen para celular (opcional)
            description: Versión más alta/cuadrada para pantallas chicas. Si no la subes, se usa la misma imagen.
            type: image
          - name: enlace
            label: Link al hacer clic (opcional)
            description: Web, Instagram o WhatsApp del auspiciador.
            type: string
          - name: desde
            label: Mostrar desde (opcional)
            type: date
          - name: hasta
            label: Mostrar hasta (opcional)
            description: Después de esta fecha el aviso se oculta solo.
            type: date

  # ───────────── EL CANAL ─────────────
  - name: canal
    label: El canal
    type: group
    items:
      - name: programas
        label: Programas
        type: file
        path: content/programas.json
        format: json
        list: true
        fields:
          - name: nombre
            label: Nombre del programa
            type: string
            required: true
          - name: id
            label: Identificador
            description: Palabra corta sin espacios ni tildes para la dirección web (ej. caseta-femenina → /programa-caseta-femenina). No la cambies después de crearla.
            type: string
            required: true
          - name: categoria
            label: Sección
            type: select
            options:
              values:
                - { name: actualidad, label: Actualidad }
                - { name: comunidad, label: Comunidad }
                - { name: deportes, label: Deportes }
                - { name: cultura, label: Cultura }
                - { name: pueblo-mapuche, label: Pueblo Mapuche }
                - { name: opinion, label: Opinión }
          - name: descripcion
            label: Descripción
            type: text
          - name: palabras
            label: Palabras que identifican sus videos en YouTube
            description: Si el título de un video contiene alguna de estas palabras, se agrega solo a este programa (ej. "caseta").
            type: string
            list: true

      - name: secciones
        label: Secciones
        type: file
        path: content/secciones.json
        format: json
        list: true
        fields:
          - name: nombre
            label: Nombre de la sección
            type: string
            required: true
          - name: id
            label: Identificador
            description: No lo cambies (las notas usan este identificador). Para crear una sección nueva, pide ayuda para agregarla también a la lista de "Sección" de las noticias.
            type: string
            required: true
          - name: descripcion
            label: Descripción
            type: text
          - name: palabras
            label: Palabras para ubicar videos sin programa
            description: Si un video de YouTube no pertenece a ningún programa, se ubica en la sección cuyo listado de palabras coincida más con su título.
            type: string
            list: true

  # ───────────── TEXTOS ─────────────
  - name: textos
    label: Textos del sitio
    type: file
    path: content/textos.json
    format: json
    fields:
      - name: lema_imagen
        label: Imagen del lema (portada)
        description: Imagen ancha bajo la señal en vivo. Si la borras, se muestra el lema en texto.
        type: image
      - name: lema
        label: Lema en texto
        description: Se usa si no hay imagen del lema, y siempre para Google y lectores de pantalla.
        type: string
      - name: etiqueta_envivo
        label: Etiqueta sobre el lema en texto
        type: string
      - name: descripcion
        label: Descripción del canal
        description: Aparece en Google, al compartir la web y en "Quiénes somos".
        type: text
      - name: canal_tvd
        label: Canal TV abierta
        type: string
      - name: email
        label: Correo de contacto
        type: string
      - name: sintonia_titulo
        label: Título de "Cómo vernos"
        type: string
      - name: sintonia
        label: Tarjetas de "Cómo vernos"
        type: object
        list: true
        fields:
          - { name: destacado, label: "Texto grande (ej. 35.1)", type: string }
          - { name: titulo, label: Título, type: string }
          - { name: texto, label: Texto, type: text }
      - name: envia_etiqueta
        label: '"Envía tu nota" · etiqueta'
        type: string
      - name: envia_titulo
        label: '"Envía tu nota" · título'
        type: string
      - name: envia_texto
        label: '"Envía tu nota" · texto'
        type: text
      - name: envia_boton
        label: '"Envía tu nota" · botón'
        type: string
      - name: colabora_titulo
        label: 'Página "Envía tu nota" (/colabora) · título'
        type: string
      - name: colabora_bajada
        label: 'Página "Envía tu nota" · bajada'
        type: text
      - name: colabora_que
        label: 'Página "Envía tu nota" · qué se puede enviar'
        type: rich-text
      - name: colabora_criterios
        label: 'Página "Envía tu nota" · antes de enviar'
        type: rich-text
      - name: instagram_texto
        label: Texto de la invitación a Instagram
        type: text
      - name: nosotros_titulo
        label: Quiénes somos · título
        type: string
      - name: nosotros_bajada
        label: Quiénes somos · frase destacada
        type: text
      - name: nosotros_portada
        label: Quiénes somos · foto de portada
        type: image
      - name: nosotros_portada_movil
        label: Quiénes somos · foto de portada en celular (más liviana)
        type: image
      - name: nosotros_portada_pie
        label: Quiénes somos · pie de la foto de portada
        type: string
      - name: nosotros_texto
        label: Quiénes somos · introducción
        type: rich-text
      - name: nosotros_datos
        label: Quiénes somos · datos al costado
        type: object
        list: true
        fields:
          - { name: etiqueta, label: Etiqueta, type: string }
          - { name: valor, label: Valor, type: string }
      - name: nosotros_historia_titulo
        label: Quiénes somos · historia · título
        type: string
      - name: nosotros_historia_texto
        label: Quiénes somos · historia · texto
        type: rich-text
      - name: nosotros_historia_imagen
        label: Quiénes somos · historia · foto
        type: image
      - name: nosotros_historia_pie
        label: Quiénes somos · historia · pie de foto
        type: string
      - name: nosotros_corte_pie
        label: Quiénes somos · texto bajo el esquema del territorio
        type: string
      - name: nosotros_senal_titulo
        label: Quiénes somos · señal · título
        type: string
      - name: nosotros_senal_texto
        label: Quiénes somos · señal · texto
        type: rich-text
      - name: nosotros_hitos
        label: Quiénes somos · línea de tiempo
        description: Cada hito lleva un año o una palabra corta (ej. «Hoy»), un título y una frase.
        type: object
        list: true
        fields:
          - { name: etiqueta, label: "Año o palabra corta", type: string }
          - { name: titulo, label: Título, type: string }
          - { name: texto, label: Texto, type: text }
          - { name: imagen, label: Foto (opcional), type: image }
          - { name: pie, label: Pie de foto, type: string }
      - name: nosotros_galeria_titulo
        label: Quiénes somos · archivo · título
        type: string
      - name: nosotros_galeria_texto
        label: Quiénes somos · archivo · texto
        type: string
      - name: nosotros_galeria
        label: Quiénes somos · archivo de fotos
        description: La primera foto es la que se muestra en grande al abrir la página.
        type: object
        list: true
        fields:
          - { name: imagen, label: Foto, type: image }
          - { name: pie, label: Qué se ve, type: string }
          - { name: fecha, label: Fecha (si se conoce), type: string }
          - { name: fuente, label: Fuente o documento de origen, type: string }
      - name: nosotros_video
        label: Quiénes somos · video institucional o histórico (enlace de YouTube)
        description: Vacío = no se muestra. Usa solo videos reales del canal.
        type: string
      - name: nosotros_video_titulo
        label: Quiénes somos · título del video
        type: string
      - name: nosotros_territorio_titulo
        label: Quiénes somos · territorio · título
        type: string
      - name: nosotros_territorio_texto
        label: Quiénes somos · territorio · texto
        type: rich-text
      - name: nosotros_territorio_imagen
        label: Quiénes somos · territorio · foto
        type: image
      - name: nosotros_territorio_pie
        label: Quiénes somos · territorio · pie de foto
        type: string
      - name: nosotros_temas
        label: Quiénes somos · temas
        description: Si eliges una sección, el tema enlaza a sus noticias. Sin sección, se muestra solo como texto.
        type: object
        list: true
        fields:
          - { name: nombre, label: Tema, type: string }
          - name: seccion
            label: Sección de noticias (opcional)
            type: select
            options:
              values: ['', actualidad, comunidad, deportes, cultura, pueblo-mapuche, opinion]
      - name: nosotros_derecho_titulo
        label: Quiénes somos · principios · título
        type: string
      - name: nosotros_derecho_texto
        label: Quiénes somos · principios · texto
        type: rich-text
      - name: nosotros_valores
        label: Quiénes somos · principios · palabras clave
        type: string
        list: true
      - name: nosotros_mision
        label: Quiénes somos · Misión
        type: text
      - name: nosotros_vision
        label: Quiénes somos · Visión
        type: text
      - name: nosotros_cierre
        label: Quiénes somos · frase de cierre
        type: text
      - name: nosotros_cierre_texto
        label: Quiénes somos · texto bajo la frase de cierre
        type: string
      - name: nosotros_cierre_imagen
        label: Quiénes somos · foto de fondo del cierre
        type: image
      - name: nosotros_cierre_pie
        label: Quiénes somos · pie de la foto del cierre
        type: string
      - name: pie_texto
        label: Texto del pie de página
        type: text
