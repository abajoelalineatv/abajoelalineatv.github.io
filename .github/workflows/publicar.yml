# Publica la web en GitHub Pages y, si están las claves, también en Cloudflare Workers (ambos gratis).
# Corre: cuando el panel editorial avisa que hay contenido nuevo (al publicar o
# importar desde Instagram), con cada cambio del código, y cada 2 horas
# para traer los videos nuevos de YouTube.
# Las noticias se leen del panel (PANEL_URL), no de content/noticias.
name: Publicar web

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [contenido-actualizado]
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch: {}

env:
  PANEL_URL: https://panel-abajoelalinea.netlify.app

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publicar
  cancel-in-progress: false

# Dos etapas (como la plantilla oficial de GitHub Pages): "armar" sube el sitio y
# "publicar" lo despliega. En un solo paso, a veces GitHub todavía no "veía" el sitio
# recién subido y fallaba con "No artifacts named github-pages were found".
jobs:
  armar:
    runs-on: ubuntu-latest
    env:
      # Solo "true"/"false" (nunca la clave): decide si se publica también en Cloudflare.
      HAY_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Traer videos nuevos de YouTube
        run: node scripts/update-videos.mjs || echo "YouTube no respondió; se publica con los videos que ya hay."
      - name: Guardar videos nuevos
        run: |
          if ! git diff --quiet data/videos.json; then
            git config user.name "actualizador-web"
            git config user.email "actions@users.noreply.github.com"
            git add data/videos.json
            git commit -m "Videos nuevos de YouTube"
            git push
          fi

      - run: node scripts/build.mjs

      # Cloudflare Workers (prueba, sin dominio propio todavía): el mismo sitio de public/.
      # Requiere en el repositorio (Settings → Secrets and variables → Actions):
      #   CLOUDFLARE_API_TOKEN (plantilla "Edit Cloudflare Workers") y CLOUDFLARE_ACCOUNT_ID.
      # Sin esas claves este paso se salta y GitHub Pages se publica igual.
      - name: Publicar en Cloudflare Workers
        if: env.HAY_CLOUDFLARE == 'true'
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.159.0'
          command: deploy

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  publicar:
    needs: armar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.reintento.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true
      # Si GitHub falla de forma pasajera, un segundo intento tras una pausa.
      - if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: reintento
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5

  # Comprueba que Cloudflare y GitHub Pages quedaron con el mismo sitio. Si no, la ejecución
  # queda marcada como fallida y GitHub avisa por correo.
  comprobar:
    needs: publicar
    runs-on: ubuntu-latest
    env:
      HAY_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      CLOUDFLARE_URL: https://abajoelalinea.abajoelalinea-tv.workers.dev
      PAGES_URL: https://abajoelalineatv.github.io
    steps:
      - name: Comparar Cloudflare y GitHub Pages
        if: env.HAY_CLOUDFLARE == 'true'
        run: |
          # GitHub Pages guarda copias hasta 10 minutos: se reintenta antes de dar por fallido.
          for intento in 1 2 3 4 5 6 7 8; do
            iguales=1
            for ruta in /sitemap.xml / /noticias; do
              a=$(curl -fsSL "$CLOUDFLARE_URL$ruta?v=$GITHUB_RUN_ID-$intento" | sha256sum | cut -c1-64)
              b=$(curl -fsSL "$PAGES_URL$ruta?v=$GITHUB_RUN_ID-$intento" | sha256sum | cut -c1-64)
              [ "$a" = "$b" ] || iguales=0
            done
            if [ "$iguales" = 1 ]; then echo "Cloudflare y GitHub Pages publican el mismo sitio."; exit 0; fi
            echo "Intento $intento: todavía distintos, se espera 45 s."; sleep 45
          done
          echo "::error::Cloudflare y GitHub Pages quedaron distintos. Volver a ejecutar este flujo."
          exit 1
