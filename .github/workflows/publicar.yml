# Publica la web en GitHub Pages (gratis).
# Corre: cuando el panel editorial avisa que hay contenido nuevo (al publicar o
# importar desde Instagram), con cada cambio del código, y cada 2 horas
# para traer los videos nuevos de YouTube.
# Las noticias se leen del panel (PANEL_URL), no de content/noticias.
name: Publicar web

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [contenido-actualizado]
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch: {}

env:
  PANEL_URL: https://panel-abajoelalinea.netlify.app

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publicar
  cancel-in-progress: false

# Dos etapas (como la plantilla oficial de GitHub Pages): "armar" sube el sitio y
# "publicar" lo despliega. En un solo paso, a veces GitHub todavía no "veía" el sitio
# recién subido y fallaba con "No artifacts named github-pages were found".
jobs:
  armar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Traer videos nuevos de YouTube
        run: node scripts/update-videos.mjs || echo "YouTube no respondió; se publica con los videos que ya hay."
      - name: Guardar videos nuevos
        run: |
          if ! git diff --quiet data/videos.json; then
            git config user.name "actualizador-web"
            git config user.email "actions@users.noreply.github.com"
            git add data/videos.json
            git commit -m "Videos nuevos de YouTube"
            git push
          fi

      - run: node scripts/build.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  publicar:
    needs: armar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
